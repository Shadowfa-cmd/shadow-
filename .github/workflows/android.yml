
name: Build Shadow APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip shadow_reviewed.zip -d extracted
          find extracted -name package.json -print
          
