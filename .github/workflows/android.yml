
name: Prepare Shadow Android

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip shadow_reviewed.zip -d extracted

      - name: Inspect Android configuration
        run: |
          cd extracted/shadow
          echo "=== Root package.json ==="
          cat package.json
          echo "=== Frontend package.json ==="
          cat frontend/package.json
          echo "=== Capacitor config ==="
          cat frontend/capacitor.config.json
          
