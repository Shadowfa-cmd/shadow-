
name: Build Shadow APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP file
        run: |
          ls -lah
          test -f shadow_upgraded.zip

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o shadow_upgraded.zip -d extracted
          ls -lah extracted
          test -f extracted/shadow/package.json

      - name: Install dependencies and create Android project
        working-directory: extracted/shadow
        run: |
          npm install
          npm --prefix frontend install
          npm --prefix frontend run cap:add

      - name: Build debug APK
        working-directory: extracted/shadow
        env:
          SHADOW_API_URL: "https://shadowchat1.wispbyte.app"
        run: npm run apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-debug-apk
          path: extracted/shadow/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
